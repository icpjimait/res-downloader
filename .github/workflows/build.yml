name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*' # 当你推送如 v1.0.0 的版本标签时自动触发构建发布
  workflow_dispatch: # 同时也支持你在 GitHub 网页上随时手动点击“一键构建”

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 构建
          - os: windows-latest
            platform: windows/amd64
            name: res-downloader-windows-amd64.zip
            path: build/bin/res-downloader.exe

          # macOS 构建（Universal 通用二进制，支持 M系列芯片 + Intel 芯片）
          - os: macos-latest
            platform: darwin/universal
            name: res-downloader-macos-universal.zip
            path: build/bin/res-downloader.app

          # Linux 构建
          - os: ubuntu-22.04
            platform: linux/amd64
            name: res-downloader-linux-amd64.tar.gz
            path: build/bin/res-downloader

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Linux 系统需安装依赖库
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -platform ${{ matrix.platform }}

      # 压缩打包 Windows 产物
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build/bin/res-downloader.exe -DestinationPath ${{ matrix.name }}

      # 压缩打包 macOS 产物
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd build/bin && zip -r ../../${{ matrix.name }} res-downloader.app

      # 压缩打包 Linux 产物
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.name }} -C build/bin res-downloader

      # 上传构建产物至 GitHub Artifacts（网页可随时下载）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      # 如果是打 Tag 触发的，自动发布到 GitHub Releases 供用户直接下载
      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
